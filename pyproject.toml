[project]
name = "ai-image-detector-research"
version = "0.1.0"
description = "Reproducible experiments for real-versus-AI-generated image detection."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets>=3.0",
  "fastapi>=0.115",
  "huggingface-hub>=0.24",
  "imagehash>=4.3",
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "Pillow>=10.4",
  "python-multipart>=0.0.12",
  "pyarrow>=17.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "seaborn>=0.13",
  "torch>=2.4",
  "torchvision>=0.19",
  "tqdm>=4.66",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_image_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
