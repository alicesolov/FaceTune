experiment:
  name: resnet_baseline
  description: "FFT-only ResNet-50 baseline — reference for comparison"

model:
  type: resnet50
  pretrained: true

training:
  epochs: 10
  lr: 1.0e-4
  batch_size: 32
  optimizer: adam
  scheduler: step
  scheduler_step: 3
  scheduler_gamma: 0.5
  early_stopping_patience: 3
  mixed_precision: true

data:
  hard_negatives: false
  augmentation: false
  max_samples: null

checkpoint:
  by: f1
  drive_dir: /content/drive/MyDrive/facetune_detector_runs
