experiment:
  name: hybrid_v2_hardneg
  description: "Hybrid FFT+CLIP with hard negative mining + medium augmentation"

model:
  type: hybrid
  clip_model: openai/clip-vit-base-patch32
  freeze_clip: true
  freeze_fft: false     # start with FFT layer4 unfrozen from the beginning
  fusion_hidden: 512
  dropout: 0.3

training:
  phase1:
    epochs: 3
    lr_fusion: 5.0e-4
    lr_backbone: 1.0e-5
    batch_size: 32
  phase2:
    epochs: 7
    lr_fusion: 1.0e-5
    lr_backbone: 5.0e-6
    batch_size: 32
  optimizer: adam
  scheduler: step
  scheduler_step: 3
  scheduler_gamma: 0.5
  early_stopping_patience: 4
  mixed_precision: true
  gradient_accumulation_steps: 2    # effective batch 64

data:
  hard_negatives: true
  hard_neg_weight: 3.0              # upweight FP real images
  fp_json: fp.json
  augmentation: true
  augmentation_strength: medium
  max_samples: null

checkpoint:
  by: fpr
  drive_dir: /content/drive/MyDrive/facetune_detector_runs
